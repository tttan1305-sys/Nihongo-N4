# Kiểm tra mã và build file APK mỗi khi đẩy mã lên nhánh main (hoặc bấm chạy tay).
# File APK nằm ở mục Artifacts của lần chạy, tải về để cài thử.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Kiểm tra furigana trong bài học
        run: python3 tools/check_lessons.py assets/lessons/*.json

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nihongo-n4-apk
          path: build/app/outputs/flutter-apk/app-release.apk
