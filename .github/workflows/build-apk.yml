# Kiểm tra mã và build file APK mỗi khi đẩy mã lên nhánh main (hoặc bấm chạy tay).
# Mỗi lần build xong, file APK được đăng thành bản thử (pre-release) ở mục Releases để tải thẳng về điện thoại.
name: Build APK

on:
  push:
    branches: [main]
    # Chỉ sửa tài liệu thì không cần build lại.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Kiểm tra furigana trong bài học
        run: python3 tools/check_lessons.py assets/lessons/*.json

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Giải mã khóa ký APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64, APK ký bằng khóa debug (đăng nhập Google trên Android sẽ không chạy)."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nihongo-n4-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Đăng bản thử lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk nihongo-n4-thu-${{ github.run_number }}.apk
          gh release create "thu-${{ github.run_number }}" nihongo-n4-thu-${{ github.run_number }}.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Bản thử #${{ github.run_number }}" \
            --notes "Bản thử tự build từ commit ${{ github.sha }}. Tải file .apk về điện thoại Android rồi mở để cài."
